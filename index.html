<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>روزشمار شمسی</title>
<meta name="description" content="محاسبه‌ی تاریخ شمسی بر اساس تعداد روز، روزهای کاری، تقویم، مناسبت‌ها و محاسبه‌ی سن — طراحی و توسعه : علی شکری">
<meta name="theme-color" content="#F4F6FA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="روزشمار">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main class="app">
 <section class="tab tabToday" id="tab0"><iframe id="todayFrame" src="today.html?embed=1" title="امروز"></iframe></section>
 <section class="tab" id="tab1" hidden>
  <h1>محاسبه تاریخ بر اساس تعداد روز</h1>
  <div class="today" id="today"></div>
  <div class="today en" id="todayEn" dir="ltr"></div>

  <div class="labrow"><div class="label">تعداد روز :</div>
    <button class="basex" id="baseClear" aria-label="شروع شمارش از امروز" hidden>✕</button>
    <button class="basebtn" id="baseBtn" aria-label="روز شروع شمارش"></button>
    <button class="calbtn small" id="baseCal" aria-label="انتخاب روز شروع شمارش از تقویم"></button></div>
  <div class="inrow">
    <button class="sq" id="plus" aria-label="یک روز بعد">+</button>
    <input id="days" inputmode="numeric" pattern="-?[0-9]*" autocomplete="off" placeholder="مثلاً 10" aria-label="تعداد روز">
    <button class="sq" id="minus" aria-label="یک روز قبل">−</button>
  </div>

  <div class="units"><span class="ul">واحد :</span>
    <button class="chip" data-u="0">روز</button><button class="chip" data-u="1">هفته</button><button class="chip" data-u="2">ماه</button></div>
  <div class="check" id="chkInc"><span class="bx"></span><span id="incTxt">خود امروز هم جزو شمارش باشد</span></div>
  <div class="check" id="chkWork"><span class="bx"></span><span>فقط روزهای کاری (بدون جمعه و تعطیلات رسمی)</span></div>
  <div class="check sub" id="chkThu"><span class="bx"></span><span>پنج‌شنبه هم تعطیل حساب شود</span></div>

  <div class="resrow">
    <div class="result" id="result" role="button" aria-label="کپی تاریخ"></div>
    <button class="calbtn" id="calBtn" aria-label="تقویم"></button>
  </div>
  <div class="info">
    <div class="wd" id="wd"></div>
    <div class="rel" id="rel"></div>
    <div class="gl" id="greg"></div>
    <div class="gl" id="hijri"></div>
    <button class="peek" id="evPeek"></button>
    <div class="cp" id="copied"></div>
  </div>

  <div class="acts">
    <button class="pill" id="shareBtn">اشتراک‌گذاری</button>
    <button class="pill" id="remBtn">یادآور</button>
    <button class="pill" id="histBtn">سابقه</button>
  </div>
 </section>

 <section class="tab" id="tab2" hidden>
  <h2 class="ttl" id="evTitle">مناسبت‌های روز حاصل</h2>
  <section class="events" id="events" hidden><div id="evList"></div></section>
  <div class="msg muted" id="evNone">اول در زبانه‌ی «محاسبه» تعداد روز را بنویسید .</div>
 </section>

 <section class="tab" id="tab3" hidden>
  <h2 class="ttl">ابزارها</h2>
  <button class="tile" id="diffBtn"><b>📏 فاصله‌ی دو تاریخ</b><span>چند روز، هفته، ماه و روز کاری بین دو تاریخ</span></button>
  <button class="tile" id="ageBtn"><b>🎂 محاسبه‌ی سن</b><span>سن دقیق، روز تولد و فاصله تا تولد بعدی</span></button>
  <button class="tile" id="histTile"><b>🕘 سابقه‌ی محاسبه‌ها</b><span>۳۰ محاسبه‌ی آخر؛ با زدن روی هر مورد دوباره حساب می‌شود</span></button>
 </section>

 <section class="tab" id="tab4" hidden>
  <h2 class="ttl">تنظیمات و راهنما</h2>
  <button class="tile" id="themeBtn"><b>🎨 تغییر تم و رنگ‌ها</b><span>رنگ اصلی و رنگ زمینه، روشن یا تیره</span></button>
  <button class="tile" id="helpBtn"><b>❔ راهنما</b><span>همه‌ی امکانات برنامه، کوتاه و ساده</span></button>
  <div class="ver" id="ver"></div>
  <div class="credit" id="credit"></div>
 </section>
</main>

<nav class="tabbar" id="tabbar">
  <button data-t="0"><i>🗓️</i><span>امروز</span></button>
  <button data-t="1"><i>🧮</i><span>محاسبه</span></button>
  <button data-t="2"><i>📅</i><span id="tabEvName">مناسبت‌ها</span></button>
  <button data-t="3"><i>🧰</i><span>ابزارها</span></button>
  <button data-t="4"><i>⚙️</i><span>بیشتر</span></button>
</nav>

<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>

<script src="core.js"></script>
<script src="ui.js"></script>
<script src="app.js"></script>
</body>
</html>
